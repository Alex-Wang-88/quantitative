[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-paper"
version = "0.1.0"
description = "A-share local quantitative paper trading and decision support platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "scikit-learn>=1.5,<2",
  "lightgbm>=4.5,<5",
  "duckdb>=1.1,<2",
]

[project.optional-dependencies]
data = [
  "tushare>=1.4,<2",
  "akshare>=1.16,<2",
  "baostock>=0.9,<1",
]
ifind = [
  "iFinDAPI>=0.0.8,<1",
]
windows = [
  "winotify>=1.1,<2",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
quant-paper = "quantpaper.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
